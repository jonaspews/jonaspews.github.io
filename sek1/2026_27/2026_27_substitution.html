<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Vertretungsmaterial</title>

		<link rel="stylesheet" href="../dist/reset.css">
		<link rel="stylesheet" href="../dist/reveal.css">
		<link rel="stylesheet" href="../dist/theme/sky.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="../plugin/highlight/monokai.css">

    
    
    <style>
      .reveal .slides section { text-align: left; }
      .reveal h1 { font-size: 1.6em; text-transform: none; }
      .reveal h2 { font-size: 1.25em; text-transform: none; }
      .reveal h3 { font-size: 1.05em; text-transform: none; }
      .reveal .kicker {
        display: block;
        font-size: 0.55em;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 0.4em;
      }
      .reveal .title-slide h1 { font-size: 2.0em; }
      .reveal .title-slide .meta { margin-top: 1.5em; font-size: 0.7em; color: #4b5563; }
      .reveal .warning { color: #b91c1c; font-weight: 700; }
      .reveal table { margin: 0.5em 0; font-size: 0.7em; }
      .reveal table th { background: #1f2937; color: #fff; }
      .reveal ol, .reveal ul { margin-left: 1em; }
      .reveal .img-note {
        display: block;
        font-size: 0.55em;
        color: #9ca3af;
        font-style: italic;
        margin-top: 0.5em;
      }
      .footer-org {
        position: absolute;
        bottom: 0.4em;
        left: 1em;
        font-size: 0.45em;
        color: #9ca3af;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">

        <!-- 1. Titelfolie --><!-- first column-->
        <section class="title-slide">
          <h1>Vertretungsmaterial</h1>
          <div class="meta">
            <p>Jonas Pews</p>
            <p>Schuljahr 2026/27</p>
            <p>Käthe-Kollwitz-Gesamtschule</p>
          </div>
        </section>

        <!-- start second column-->
        <section>
          <!-- English -->
          <section>
            <span class="kicker">English - MSA Prep</span>
            <p>MSA prep sources by LISUM</p>
            <a href="https://www.bildungsserver.de/schule/pruefungsvorbereitung-fuer-mittleren-schulabschluss-13097-de.html#Musteraufgaben_und_Lernportale_fuer_das_Fach_Englisch" target="_blank"><img src="img/msa_prep_lisum.png"></a>
          </section>
          
          <section>
            <span class="kicker">English - MSA Prep</span>
            <p>MSA prep Englisch-Hilfen.de</p>
            <a href="https://www.englisch-hilfen.de/exams/abschlusspruefungen.htm" target="_blank"><img src="img/englisch-hilfen_pruefungen.png"></a>
          </section>
          
          <section>
            <span class="kicker">English</span>
            <p>Englisch-Hilfen.de - Tests</p>
            <a href="https://www.englisch-hilfen.de/exercises_list/test.htm" target="_blank"><img src="img/englisch-hilfen_tests.png"></a>
          </section>

          <section>
            <span class="kicker">English</span>
            <p>Englisch-Hilfen.de - Grammar</p>
            <a href="https://www.englisch-hilfen.de/exercises_list/alle_grammar.htm" target="_blank"><img src="img/englisch-hilfen_grammar.png"></a>
          </section>


        </section>
        <!-- end second column-->

      </div>
    </div>

    <script src="../dist/reveal.js"></script>
		<script src="../plugin/notes/notes.js"></script>
		<script src="../plugin/markdown/markdown.js"></script>
		<script src="../plugin/highlight/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
  </body>
</html>
